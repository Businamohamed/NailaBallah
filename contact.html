<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.contact{
    width:400px;
    margin:50px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.contact h2{
    text-align:center;
    color:#333;
}

.contact input,
.contact textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.contact textarea{
    height:120px;
    resize:none;
}

.contact button{
    width:100%;
    padding:10px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.contact button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="contact">
    <h2>تواصل معنا</h2>

    <form>
        <input type="text" placeholder="الاسم" required>
        <input type="email" placeholder="البريد الإلكتروني" required>
        <input type="text" placeholder="الموضوع">
        <textarea placeholder="اكتب رسالتك هنا..." required></textarea>
        <button type="submit">إرسال</button>
    </form>
</div>

</body>
</html>
